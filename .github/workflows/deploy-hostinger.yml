name: Deploy Hostinger

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-hostinger-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Deploy ön kontrol
        id: gate
        env:
          HOSTINGER_SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
        run: |
          if [ -z "$HOSTINGER_SSH_HOST" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Deploy atlandı — GitHub Secrets tanımlı değil."
            echo "Settings → Secrets → Actions: HOSTINGER_SSH_HOST, HOSTINGER_SSH_USER, HOSTINGER_SSH_KEY, HOSTINGER_DEPLOY_PATH"
            echo "Ayrıca: DATABASE_URL_BUILD, AUTH_SECRET, NEXT_PUBLIC_SITE_URL, AUTH_URL, NEXTAUTH_URL"
            exit 0
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - name: Deploy over SSH
        if: steps.gate.outputs.deploy == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            export DEPLOY_PATH="${{ secrets.HOSTINGER_DEPLOY_PATH }}"
            export DEPLOY_BRANCH="main"
            export DATABASE_URL="${{ secrets.DATABASE_URL_BUILD }}"
            export AUTH_SECRET="${{ secrets.AUTH_SECRET }}"
            export NEXT_PUBLIC_SITE_URL="${{ secrets.NEXT_PUBLIC_SITE_URL }}"
            export AUTH_URL="${{ secrets.AUTH_URL }}"
            export NEXTAUTH_URL="${{ secrets.NEXTAUTH_URL }}"
            export HOSTINGER_RESTART_CMD="${{ secrets.HOSTINGER_RESTART_CMD }}"
            cd "$DEPLOY_PATH"
            bash scripts/deploy-hostinger-remote.sh
